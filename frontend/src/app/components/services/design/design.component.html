<section id="design" class="service">
  <div
    style="
      background-image: url('assets/images/ceco-img/FP-Design.webp');
      height: 50vh;
      background-size: cover;
      background-position: 100% 19%;
      position: relative;
    "
    class="service-bg"
  >
    <div class="service-title col-md-11 p-4">
      <p class="ms-5 fs-1">{{ "design_page.header1" | translate }}</p>
    </div>
  </div>
  <div class="inner row service-content-wrapper">
    <div class="service-content col-md-8 mt-5">
      <p class="fs-2" style="color: #fc4852">
        {{ "design_page.header2" | translate }}
      </p>
      <p class="content" [innerHTML]="'design_page.content' | translate"></p>
    </div>
    <div class="col-md-4 mt-5 p-5 services-container">
      <div class="group-item-wrapper">
        <p class="fs-2 text-center title pt-4">
          {{ "service_page.title" | translate }}
        </p>
        <a
          routerLink="/installation"
          style="
            background-image: url('assets/images/ceco-img/FP-Install.webp');
            object-fit: cover;
          "
          class="group-item"
        >
          <span class="text">{{
            "service_page.installation_title" | translate
          }}</span>
        </a>
        <a
          routerLink="/commissioning"
          style="
            background-image: url('assets/images/ceco-img/FP-Test.webp');
            object-fit: cover;
          "
          class="group-item"
        >
          <span class="text">{{
            "service_page.commissioning_title" | translate
          }}</span>
        </a>
        <a
          routerLink="/maintenance"
          style="
            background-image: url('assets/images/ceco-img/FP-Maintenance.webp');
            object-fit: cover;
          "
          class="group-item"
        >
          <span class="text">{{ "service_page.maintenance" | translate }}</span>
        </a>
      </div>
    </div>
    <app-previous-work
      typeData="design"
      class="previous-work-wrapper"
    ></app-previous-work>
  </div>
</section>
