  # ----------------------------------------------------- admin: audit log ----

  /api/v1/admin/audit-logs:
    get:
      tags: [Admin · audit log]
      summary: Read the audit log
      description: Read-only; there is no route that edits or deletes an entry.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userId
          in: query
          schema: { type: integer }
        - name: username
          in: query
          schema: { type: string }
        - name: actions
          in: query
          description: One action, or several separated by commas
          schema: { type: string, example: LOGIN,LOGIN_FAILED }
        - name: result
          in: query
          schema: { type: string, enum: [success, failure] }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Entries, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AuditLog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
